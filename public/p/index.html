<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OshiNium</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #FAFAFC; color: #1c1c1e; text-align: center; padding: 24px; box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) { body { background: #0c0c10; color: #f2f2f7; } }
  .card { max-width: 360px; }
  .logo {
    width: 88px; height: 88px; border-radius: 24px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #b38cf9, #7a5af5);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #fff;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #6e6e73; margin: 0 0 24px; }
  @media (prefers-color-scheme: dark) { p { color: #9a9aa2; } }
  a.button {
    display: inline-block; padding: 14px 28px; border-radius: 999px;
    background: linear-gradient(90deg, #b38cf9, #7a5af5); color: #fff;
    font-weight: 700; font-size: 15px; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">推</div>
    <h1 id="title">OshiNiumは近日公開予定です</h1>
    <p id="message">このリンクはOshiNiumアプリの投稿ページです。アプリをお持ちでない場合は、公開までもうしばらくお待ちください。</p>
    <a class="button" id="storeLink" href="#" style="display:none;">App Storeで見る</a>
  </div>
  <script>
    // ★ App Store Connectでアプリを公開したら、下のAPP_STORE_IDに実際のIDを入れる
    //   （例: "id1234567890"）。IDが入るまではこのページは「近日公開」表示のままにし、
    //   IDが入った瞬間から自動でApp Storeへリダイレクトするように切り替わる
    var APP_STORE_ID = null; // 例: "id1234567890"

    if (APP_STORE_ID) {
      var url = "https://apps.apple.com/app/" + APP_STORE_ID;
      document.getElementById("title").textContent = "OshiNiumはApp Storeで公開中です";
      document.getElementById("message").textContent = "この投稿を見るにはOshiNiumアプリが必要です。";
      var link = document.getElementById("storeLink");
      link.href = url;
      link.style.display = "inline-block";
      location.href = url;
    }
  </script>
</body>
</html>
